<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAFINOOR Real-time Master Admin</title><style>body{margin:0;font:14px system-ui;background:#0b1220;color:#e5eefc}header{padding:18px;background:#111c31;display:flex;justify-content:space-between;gap:12px;align-items:center}main{padding:18px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#111c31;border:1px solid #263753;border-radius:12px;padding:14px}.num{font-size:28px;font-weight:700}.muted{color:#91a4c4}input,button,select{padding:10px;border-radius:8px;border:1px solid #344866;background:#0b1220;color:#fff}button{cursor:pointer;background:#2563eb}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.table{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #263753;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#17243a}.ok{color:#4ade80}.bad{color:#fb7185}.warn{color:#fbbf24}#login{max-width:420px;margin:10vh auto}.hidden{display:none}.pill{padding:3px 8px;border-radius:20px;background:#263753}</style></head><body>
<header><div><b>RAFINOOR MASTER CONTROL CENTER</b><div class="muted">Real-time Firebase monitoring</div></div><div><span id="conn" class="pill">Connecting…</span> <button id="logout">Logout</button></div></header>
<section id="login" class="card"><h2>Master Admin Login</h2><p class="muted">Sign in with an authorized Firebase account.</p><button id="google">Continue with Google</button><p id="err" class="bad"></p></section>
<main id="app" class="hidden"><div class="grid" id="kpis"></div><div class="toolbar"><input id="search" placeholder="Search activity, user, site…"><select id="path"><option value="activityLogs">Activity Logs</option><option value="onlineUsers">Online Users</option><option value="loggedInUsers">Logged In Users</option><option value="sites">Sites</option><option value="workOrders">Work Orders</option><option value="pgRuns">PG Runs</option><option value="fuelWallets">Fuel Wallets</option><option value="smsNotifications">SMS Notifications</option><option value="invoices">Invoices</option><option value="liveLocations">Live Locations</option></select><button id="refresh">Refresh view</button><button id="export">Export JSON</button></div><div class="card"><h3 id="heading">Activity Logs</h3><div class="table"><table><thead><tr><th>Key</th><th>Data</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h3>System Events</h3><div id="events" class="muted">Waiting for events…</div></div></main>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js';import{getDatabase,ref,onValue,off,get,child}from'https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js';
const config={apiKey:'AIzaSyCtUJWCd94jxseVw1xkQJJTEO4qwIUg2G4',authDomain:'live-map-3ceeb.firebaseapp.com',databaseURL:'https://live-map-3ceeb-default-rtdb.firebaseio.com',projectId:'live-map-3ceeb',storageBucket:'live-map-3ceeb.firebasestorage.app',messagingSenderId:'301571274340',appId:'1:301571274340:web:f98b4249b574ce4c1f1171'};
const app=initializeApp(config),auth=getAuth(app),db=getDatabase(app);let current=null,cache={},listeners={};const $=id=>document.getElementById(id);function event(t,c=''){ $('events').innerHTML='<div>'+new Date().toLocaleTimeString()+' — '+t+' '+c+'</div>'+$('events').innerHTML; }
function flat(obj){return Object.entries(obj||{}).map(([k,v])=>({k,v}));}function render(){const p=$('path').value,q=$('search').value.toLowerCase();$('heading').textContent=p;const data=cache[p]||{};const rows=flat(data).filter(x=>(x.k+' '+JSON.stringify(x.v)).toLowerCase().includes(q));$('rows').innerHTML=rows.map(x=>'<tr><td>'+esc(x.k)+'</td><td><pre>'+esc(JSON.stringify(x.v,null,2))+'</pre></td></tr>').join('')||'<tr><td colspan="2">No data</td></tr>';}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const paths=['activityLogs','onlineUsers','loggedInUsers','sites','workOrders','pgRuns','fuelWallets','smsNotifications','invoices'];function listen(p){const r=ref(db,p);onValue(r,s=>{cache[p]=s.val()||{};if(p===$('path').value)render();update();event(p+' synchronized');},e=>event(p+' error',e.message));listeners[p]=r;}function update(){const counts=paths.map(p=>[p,Object.keys(cache[p]||{}).length]);$('kpis').innerHTML=counts.map(([p,n])=>'<div class="card"><div class="muted">'+p+'</div><div class="num">'+n+'</div></div>').join('');}
$('google').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>$('err').textContent=e.message);$('logout').onclick=()=>signOut(auth);$('path').onchange=render;$('search').oninput=render;$('refresh').onclick=()=>{cache={};paths.forEach(listen);};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(cache,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rafinoor-master-export.json';a.click();};onValue(ref(db,'.info/connected'),s=>{$('conn').textContent=s.val()?'Firebase Connected':'Offline';$('conn').className='pill '+(s.val()?'ok':'bad');});onAuthStateChanged(auth,u=>{current=u;if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');paths.forEach(listen);event('Signed in as',u.email||u.uid);}else{$('login').classList.remove('hidden');$('app').classList.add('hidden');}});
</script></body></html>
